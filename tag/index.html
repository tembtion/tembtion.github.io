---
layout: default
current: tag
title: Tag Page
class: 'tag-template'
navigation: True
---

<header class="site-header-index outer" style="background-image: url(/assets/images/common/tag-cover.jpg)">
    <div class="inner">
        {% include site-nav.html %}
        <div class="site-header-content">
            <h1 class="site-title">Tag</h1>
            <h2 class="site-description">
            </h2>
        </div>
    </div>
</header>

<!-- The main content area -->
<main id="site-main" class="site-main outer" role="main">
    <div class="inner">
        <div class="post-feed">
            {% for tag in site.data.tags %}
            <article class="post-card tag-template" data-aos="fade-up" data-aos-offset="100" data-aos-once="true" style="min-height:200px;max-width: 200px">
                <a class="post-card-image-link" href="{{ site.baseurl }}/tag/{{ tag[0] }}">
                    <div class="post-card-image" style="font-size: 40px;color: #FFFFFF;align-content: center;text-align: center;background-image: url({{ site.baseurl }}{{ tag[1].cover }})">{{ tag[1].name }}</div>
                </a>
            </article>
            {% endfor %}
        </div>
    </div>
</main>
